name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (use \n for newlines)
        type: string
        required: false
      bump:
        description: 'Bump type'
        required: false
        default: 'next'
        type: choice
        options:
          - 'next'
          - 'major'
          - 'minor'
          - 'patch'
          - 'current'
      github_release:
        description: 'Create Github Release'
        default: true
        type: boolean
      docker_release:
        description: 'Push Docker images'
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_current: ${{ steps.versions.outputs.version_current }}
      version_next: ${{ steps.versions.outputs.version_next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install svu
        run: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt update
          sudo apt install svu
      - name: Compute next version for release
        run: |
          echo "VERSION_NEXT=$(svu ${{ inputs.bump }})" >> "$GITHUB_ENV"
      - name: Set Versions
        id: versions
        run: |
          echo "version_current=$(svu current)" >> "$GITHUB_OUTPUT"
          echo "version_next=${{ env.VERSION_NEXT }}" >> "$GITHUB_OUTPUT"

  webui_dist:
    name: Build web UI dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'next-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: next-ui/package-lock.json

      # next UI reads the commit from the working tree, so it builds before the web UI patch is applied
      - name: Build next UI
        working-directory: next-ui
        run: |
          npm ci
          npm run build

      - name: Upload next UI dist
        uses: actions/upload-artifact@v7
        with:
          name: nextui-dist
          path: next-ui/dist/**
          if-no-files-found: error

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'komga-webui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: komga-webui/package-lock.json

      - name: Patch web UI build config
        run: |
          set -euo pipefail
          git apply --verbose patches/komga-webui-disable-fork-ts-checker.patch

      - name: Build web UI
        working-directory: komga-webui
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npm ci
          npm run build

      - name: Upload web UI dist
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: komga-webui/dist/**
          if-no-files-found: error

  binary_release:
    name: Release binary (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.runner }}
    needs:
      - version
      - webui_dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact_suffix: linux-amd64-gnu
            release_package_name: release-package-amd64-gnu
            arch: amd64
            target: x86_64-unknown-linux-gnu
            pdfium_platform_key: linux-x86_64-gnu
            pdfium_asset_dir: pdfium-linux-x64
            binary_source: komga-rust
            binary_name: komga-riir
            pdfium_library_path: lib/libpdfium.so
            pdfium_library_name: libpdfium.so
            docker_runtime: false
          - runner: ubuntu-latest
            platform: linux
            artifact_suffix: linux-arm64-gnu
            release_package_name: release-package-arm64-gnu
            arch: arm64
            target: aarch64-unknown-linux-gnu
            pdfium_platform_key: linux-aarch64-gnu
            pdfium_asset_dir: pdfium-linux-arm64
            binary_source: komga-rust
            binary_name: komga-riir
            pdfium_library_path: lib/libpdfium.so
            pdfium_library_name: libpdfium.so
            docker_runtime: false
          - runner: ubuntu-latest
            platform: linux
            artifact_suffix: linux-amd64-musl
            release_package_name: release-package-amd64-musl
            arch: amd64
            target: x86_64-unknown-linux-musl
            pdfium_platform_key: linux-x86_64-musl
            pdfium_asset_dir: pdfium-linux-musl-x64
            binary_source: komga-rust
            binary_name: komga-riir
            pdfium_library_path: lib/libpdfium.so
            pdfium_library_name: libpdfium.so
            docker_runtime: true
          - runner: ubuntu-latest
            platform: linux
            artifact_suffix: linux-arm64-musl
            release_package_name: release-package-arm64-musl
            arch: arm64
            target: aarch64-unknown-linux-musl
            pdfium_platform_key: linux-aarch64-musl
            pdfium_asset_dir: pdfium-linux-musl-arm64
            binary_source: komga-rust
            binary_name: komga-riir
            pdfium_library_path: lib/libpdfium.so
            pdfium_library_name: libpdfium.so
            docker_runtime: true
          - runner: windows-latest
            platform: windows
            artifact_suffix: windows-amd64-msvc
            release_package_name: release-package-windows-amd64-msvc
            arch: amd64
            target: x86_64-pc-windows-msvc
            pdfium_platform_key: windows-x86_64-msvc
            pdfium_asset_dir: pdfium-win-x64
            binary_source: komga-rust.exe
            binary_name: komga-riir.exe
            pdfium_library_path: bin/pdfium.dll
            pdfium_library_name: pdfium.dll
            docker_runtime: false
          - runner: macos-14
            platform: macos
            artifact_suffix: macos-arm64
            release_package_name: release-package-macos-arm64
            arch: arm64
            target: aarch64-apple-darwin
            pdfium_platform_key: macos-aarch64
            pdfium_asset_dir: pdfium-mac-arm64
            binary_source: komga-rust
            binary_name: komga-riir
            pdfium_library_path: lib/libpdfium.dylib
            pdfium_library_name: libpdfium.dylib
            docker_runtime: false
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      VERSION_NEXT: ${{ needs.version.outputs.version_next }}
      CROSS_CONFIG: komga-rust/Cross.toml
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: --cfg tokio_unstable
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: --cfg tokio_unstable
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=-crt-static --cfg tokio_unstable
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=-crt-static --cfg tokio_unstable
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: --cfg tokio_unstable
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: --cfg tokio_unstable
    defaults:
      run:
        shell: bash
    steps:
      - name: Remove unnecessary files
        if: matrix.platform == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Display versions
        run: |
          echo "Current version: ${{ needs.version.outputs.version_current }}"
          echo "Release version: ${VERSION}"

      - name: Download web UI dist
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: komga-webui/dist

      - name: Download next UI dist
        uses: actions/download-artifact@v8
        with:
          name: nextui-dist
          path: next-ui/dist

      - name: Verify build inputs
        run: |
          set -euo pipefail
          test -d komga-webui/dist
          test -f komga-webui/dist/index.html
          test -d next-ui/dist
          test -f next-ui/dist/index.html
          test -f komga/src/main/resources/banner.txt
          test -d komga/src/main/resources/embeddedFonts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.platform == 'linux'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build Rust release binary with cross
        if: matrix.platform == 'linux'
        run: |
          cross build --manifest-path komga-rust/Cargo.toml --locked --release --features image-nasm --bin komga-rust --target ${{ matrix.target }}

      - name: Build Rust release binary
        if: matrix.platform != 'linux'
        run: |
          cargo build --manifest-path komga-rust/Cargo.toml --locked --release --features image-nasm --bin komga-rust --target ${{ matrix.target }}

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          release_dir="dist/komga-riir-${VERSION}-${{ matrix.artifact_suffix }}"
          release_artifact="${release_dir}.tar.gz"
          rm -rf "$release_dir"
          mkdir -p "$release_dir/licenses/pdfium"
          binary_path="komga-rust/target/${{ matrix.target }}/release/${{ matrix.binary_source }}"
          test -f "$binary_path"
          cp "$binary_path" "$release_dir/${{ matrix.binary_name }}"
          if [[ "${{ matrix.platform }}" != 'windows' ]]; then
            chmod +x "$release_dir/${{ matrix.binary_name }}"
          fi
          pdfium_release_tag="$(tr -d '\r\n' < komga-rust/vendor/pdfium-release)"
          test -n "$pdfium_release_tag"
          pdfium_vendor_directory="$(printf '%s' "$pdfium_release_tag" | tr '/' '-')"
          pdfium_lib="komga-rust/vendor/pdfium-binaries/${pdfium_vendor_directory}/${{ matrix.pdfium_platform_key }}/${{ matrix.pdfium_asset_dir }}/${{ matrix.pdfium_library_path }}"
          test -f "$pdfium_lib"
          cp "$pdfium_lib" "$release_dir/${{ matrix.pdfium_library_name }}"
          pdfium_license_dir=$(dirname "$pdfium_lib")/../licenses
          if [[ -d "$pdfium_license_dir" ]]; then
            cp -R "$pdfium_license_dir/." "$release_dir/licenses/pdfium/"
          fi
          tar -czf "$release_artifact" -C dist "$(basename "$release_dir")"
          if [[ "${{ matrix.docker_runtime }}" == 'true' ]]; then
            docker_artifact_dir="docker-artifacts/linux-musl/${{ matrix.arch }}"
            rm -rf "$docker_artifact_dir"
            mkdir -p "$docker_artifact_dir"
            cp "$binary_path" "$docker_artifact_dir/komga-rust"
            chmod +x "$docker_artifact_dir/komga-rust"
            cp "$pdfium_lib" "$docker_artifact_dir/libpdfium.so"
          fi

      - name: Verify packaged artifacts
        run: |
          set -euo pipefail
          test -f "dist/komga-riir-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz"
          if [[ "${{ matrix.docker_runtime }}" == 'true' ]]; then
            test -f "docker-artifacts/linux-musl/${{ matrix.arch }}/komga-rust"
            test -f "docker-artifacts/linux-musl/${{ matrix.arch }}/libpdfium.so"
          fi

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_package_name }}
          path: dist/komga-riir-${{ env.VERSION }}-${{ matrix.artifact_suffix }}.tar.gz
          if-no-files-found: error

      - name: Upload Docker runtime artifact
        if: matrix.docker_runtime
        uses: actions/upload-artifact@v7
        with:
          name: docker-artifacts-${{ matrix.arch }}
          path: |
            docker-artifacts/linux-musl/${{ matrix.arch }}/komga-rust
            docker-artifacts/linux-musl/${{ matrix.arch }}/libpdfium.so
          if-no-files-found: error

  github_release:
    name: Publish GitHub release
    if: inputs.github_release
    runs-on: ubuntu-latest
    needs:
      - version
      - binary_release
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      VERSION_CURRENT: ${{ needs.version.outputs.version_current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.VERSION_CURRENT }}
          head-ref: ${{ github.sha }}

      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          mkdir -p release_notes
          printf '%b\n' "$RELEASE_NOTES" > release_notes/release_notes.md
          mapfile -t release_artifacts < <(find dist -maxdepth 1 -type f -name 'komga-riir-*.tar.gz' | sort)
          if [[ ${#release_artifacts[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          if [[ -n "$CHANGELOG" ]]; then
            printf '\n%s\n' "$CHANGELOG" >> release_notes/release_notes.md
          fi
          {
            echo ""
            echo "## Checksums"
            echo ""
            for artifact in "${release_artifacts[@]}"; do
              artifact_name=$(basename "$artifact")
              artifact_sha256=$(sha256sum "$artifact" | cut -d' ' -f1)
              printf -- '- `%s`: `%s`\n' "$artifact_name" "$artifact_sha256"
            done
          } >> release_notes/release_notes.md
          echo "Release notes:"
          cat release_notes/release_notes.md
          echo ""

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t release_artifacts < <(find dist -maxdepth 1 -type f -name 'komga-riir-*.tar.gz' | sort)
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes-file release_notes/release_notes.md
            gh release upload "${VERSION}" "${release_artifacts[@]}" --clobber
          else
            gh release create "${VERSION}" "${release_artifacts[@]}" --target "${GITHUB_SHA}" --title "${VERSION}" --notes-file release_notes/release_notes.md
          fi

  docker_release:
    name: Release Docker image
    if: inputs.docker_release
    runs-on: ubuntu-latest
    needs:
      - version
      - binary_release
    env:
      VERSION: ${{ needs.version.outputs.version_next }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_NAME_DOCKERHUB: dyphire/komga-riir
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Display versions
        run: |
          echo "Current version: ${{ needs.version.outputs.version_current }}"
          echo "Release version: ${VERSION}"

      - name: Download amd64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-amd64
          path: docker-artifacts/linux-musl/amd64

      - name: Download arm64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-arm64
          path: docker-artifacts/linux-musl/arm64

      - name: Verify Docker runtime artifacts
        run: |
          set -euo pipefail
          test -f docker-artifacts/linux-musl/amd64/komga-rust
          test -f docker-artifacts/linux-musl/amd64/libpdfium.so
          test -f docker-artifacts/linux-musl/arm64/komga-rust
          test -f docker-artifacts/linux-musl/arm64/libpdfium.so

      - name: Strip Docker runtime artifacts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          strip --strip-unneeded docker-artifacts/linux-musl/amd64/komga-rust
          strip --strip-unneeded docker-artifacts/linux-musl/amd64/libpdfium.so
          aarch64-linux-gnu-strip --strip-unneeded docker-artifacts/linux-musl/arm64/komga-rust
          aarch64-linux-gnu-strip --strip-unneeded docker-artifacts/linux-musl/arm64/libpdfium.so

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image metadata
        id: image
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "${IMAGE_NAME_DOCKERHUB}:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "${IMAGE_NAME_DOCKERHUB}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./komga-rust/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: dyphire/komga-riir
          readme-filepath: ./README.md
