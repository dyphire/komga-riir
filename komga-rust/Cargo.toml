[workspace]
members = [
  ".",
  "crates/epub",
  "crates/kepubify",
  "crates/domain",
  "crates/application",
  "crates/infrastructure/base",
  "crates/infrastructure/search",
  "crates/infrastructure/media-core",
  "crates/infrastructure/discovery",
  "crates/infrastructure/media-library",
  "crates/infrastructure/media-metadata",
  "crates/infrastructure/media-access",
  "crates/infrastructure/identity",
  "crates/infrastructure/jobs",
  "crates/infrastructure/operational",
  "crates/infrastructure/opds",
  "crates/infrastructure/tasks",
  "crates/infrastructure/test-support",
  "crates/interfaces",
  "crates/config",
  "crates/oauth",
  "crates/server",
  "crates/build-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.5", features = ["cookie", "multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
config = "0.15.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tokio-stream = "0.1.19"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
tracing = "0.1.44"
http-body = "1.1.0"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "json", "time"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
oauth2-reqwest = { package = "reqwest", version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
regex = "1.13.1"
rxing = "0.9.2"
toml = "1.1.4"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "csrf", "trace"] }
tower-sessions = "0.15.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
tantivy = "0.26.1"
tar = "0.4.46"
zip = "9.0.0-pre3"
flate2 = "1.1.9"
lopdf = "0.44.0"
quick-xml = "0.42.0"
iepub = { version = "1.3.7", default-features = false, features = ["no_nav"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset"] }
tsid = "0.3.4"
futures-util = "0.3.34"
async-trait = "0.1.92"
image = "0.25.8"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
getrandom = "0.4.3"
language-tags = "0.3.2"
rusqlite = "0.39.0"
pdfium-render = { version = "0.9.4", git = "https://github.com/ajrcarey/pdfium-render.git", rev = "6cee8b9a3951832ac0ff62ce4c32800278001cb8", features = ["thread_safe"] }
unrar = "0.5.8"
unicode-normalization = "0.1.25"
icu = "2.3.0"
indexmap = "2.9.0"
libc = "0.2.189"
mimalloc = "0.1.52"
windows-sys = "0.61.2"
chrono = "0.4.45"
url = "2.5.8"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[package]
name = "komga-rust"
version.workspace = true
edition.workspace = true
publish = false

[features]
image-nasm = ["komga-infrastructure-media-core/image-nasm"]

[dependencies]
axum.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
bcrypt.workspace = true
komga-config = { path = "crates/config" }
komga-server = { path = "crates/server" }
komga-domain = { path = "crates/domain" }
komga-application = { path = "crates/application" }
komga-infrastructure-media-core = { path = "crates/infrastructure/media-core" }
komga-interfaces = { path = "crates/interfaces" }
mimalloc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tower-http.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
zip.workspace = true
sha2.workspace = true
lopdf.workspace = true
tantivy.workspace = true
tempfile = "3.27.0"
image.workspace = true
icu.workspace = true
time.workspace = true
http-body.workspace = true
http-body-util = "0.1.4"
async-trait.workspace = true
openidconnect.workspace = true
chrono.workspace = true
komga-interfaces = { path = "crates/interfaces", features = ["allow-missing-webui-dist"] }
komga-infrastructure-base = { path = "crates/infrastructure/base" }
komga-infrastructure-identity = { path = "crates/infrastructure/identity" }
komga-infrastructure-jobs = { path = "crates/infrastructure/jobs" }
komga-infrastructure-operational = { path = "crates/infrastructure/operational" }
komga-infrastructure-opds = { path = "crates/infrastructure/opds" }
komga-infrastructure-tasks = { path = "crates/infrastructure/tasks" }
komga-infrastructure-search = { path = "crates/infrastructure/search" }
komga-infrastructure-media-access = { path = "crates/infrastructure/media-access" }
komga-infrastructure-media-library = { path = "crates/infrastructure/media-library" }
komga-infrastructure-media-metadata = { path = "crates/infrastructure/media-metadata" }
